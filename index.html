<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FU JIAHE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f7f6f2;
            color: #1f1f1f;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        .page {
            min-height: 100vh;
            max-width: 1100px;
            margin: 0 auto;
            padding: 64px 48px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 80px;
        }

        .intro {
            flex: 1;
        }

        h1 {
            margin: 0;
            font-size: clamp(42px, 6vw, 68px);
            font-weight: 400;
            letter-spacing: 0.12em;
            line-height: 1;
        }

        .role {
            margin-top: 28px;
            font-size: 15px;
            letter-spacing: 0.16em;
            color: #555;
        }

        .description {
            margin-top: 48px;
            max-width: 380px;
            font-size: 17px;
            line-height: 1.7;
            color: #777;
        }

        .meta {
            margin-top: 72px;
            font-size: 12px;
            letter-spacing: 0.14em;
            color: #aaa;
        }

        .portrait {
            width: min(36vw, 360px);
            aspect-ratio: 4 / 5;
            flex-shrink: 0;
            overflow: hidden;
            background: #ddd;
        }

        .portrait img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
        }

        @media (max-width: 760px) {

            .page {
                padding: 48px 28px 56px;
                flex-direction: column;
                align-items: flex-start;
                gap: 52px;
            }

            .portrait {
                width: 100%;
                max-width: none;
                order: -1;
            }

            h1 {
                font-size: 42px;
            }

            .description {
                margin-top: 36px;
            }

            .meta {
                margin-top: 48px;
            }
        }
    </style>
</head>


<body>

    <main class="page">

        <section class="intro">

            <h1>FU JIAHE</h1>

            <div class="role">
                PRODUCT · AI · IDEAS
            </div>

            <div class="description">
                A personal space for ideas,
                projects and work in progress.
            </div>

            <div class="meta">
                EST. 2026
            </div>

        </section>


        <div class="portrait">
            <img src="portrait.jpg" alt="FU JIAHE">
        </div>

    </main>

</body>

</html>
